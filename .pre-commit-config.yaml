# Quick checks on every commit. The full set is scripts/check.sh (see CLAUDE.md, "Checks").
# Generated files in spec/ are left alone by the fixers: the generator owns them.
exclude: ^(LICENSE|docs/npm-licences\.md|spec/(map\.json|map\.html|tree\.md|backbone\.md|pathways\.lock\.json|why_not\.json|cards\.json))$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: map-current
        name: generated map files are current
        entry: python3 spec/build_map.py
        language: system
        files: ^spec/(build_map\.py|map_template\.html)$
        pass_filenames: false
      - id: npm-licences
        name: npm licence record is current
        entry: python3 scripts/npm_licences.py
        language: system
        files: ^(frontend/package-lock\.json|scripts/npm_licences\.py)$
        pass_filenames: false
      - id: map-types
        name: map and backend types (mypy --strict)
        entry: .venv/bin/mypy
        language: system
        files: ^(spec|tests|scripts|backend)/.*\.py$
        pass_filenames: false
      - id: map-tests
        name: map and backend tests (pytest)
        entry: .venv/bin/pytest
        language: system
        files: ^(spec/|tests/|backend/)
        pass_filenames: false
      - id: frontend-quick
        name: frontend lint and types
        entry: sh -c 'npm --prefix frontend run -s lint && npm --prefix frontend run -s typecheck'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: private-scan
        name: private name scan (needs ATLAS_PRIVATE_SCAN)
        entry: sh -c 'if [ -z "${ATLAS_PRIVATE_SCAN:-}" ]; then echo "ATLAS_PRIVATE_SCAN is not set"; exit 1; fi; "$ATLAS_PRIVATE_SCAN"'
        language: system
        pass_filenames: false
        always_run: true
