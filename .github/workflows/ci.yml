# CI runs at releases, not on pull requests (see CLAUDE.md, "Checks").
# Every pull request is checked locally with scripts/check.sh; this is the release gate.
name: CI

on:
  milestone:
    types: [closed]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      # The R service (#142): R and the packages pinned in r_service/renv.lock.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true
      - name: R packages, at the versions in r_service/renv.lock
        run: |
          Rscript -e 'install.packages("renv", repos = "https://cloud.r-project.org")'
          Rscript -e 'renv::restore(lockfile = "r_service/renv.lock", library = .libPaths()[1], prompt = FALSE)'
      - name: Checks (the private name scan runs locally only)
        run: sh scripts/check.sh
        env:
          PYTHON: python
      # The validation run's results, for the Proof page (#163): kept even when a check fails, so the failure shows.
      - name: Keep the Proof data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof
          path: frontend/public/proof.json
          if-no-files-found: warn
      # Browser tests (#83): each app in Chromium at 360, 768 and 1280 px, in both themes.
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Browser tests (Playwright)
        run: npm --prefix frontend run e2e
