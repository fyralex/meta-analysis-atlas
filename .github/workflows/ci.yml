# CI runs at releases, not on pull requests (see CLAUDE.md, "Checks").
# Every pull request is checked locally with scripts/check.sh; this is the release gate.
name: CI

on:
  milestone:
    types: [closed]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Checks (the private name scan runs locally only)
        run: sh scripts/check.sh
        env:
          PYTHON: python
      # Browser tests (#83): each app in Chromium at 360, 768 and 1280 px, in both themes.
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Browser tests (Playwright)
        run: npm --prefix frontend run e2e
