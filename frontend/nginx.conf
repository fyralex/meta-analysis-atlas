# The apps at /meta-analysis-atlas/, as on GitHub Pages; the API behind them (#144).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location = / {
        return 302 /meta-analysis-atlas/;
    }

    location /meta-analysis-atlas/ {
        try_files $uri $uri/ /meta-analysis-atlas/index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8080;
    }
}
